name: CI and Pages

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Main pushes and manual runs share a queue; do not interrupt a live deployment.
concurrency:
  group: ci-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: 'true'

jobs:
  checks:
    name: Checks (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: root
            base: /
            site: https://research.jnist.cn
          # Compatibility check only; this target is never deployed.
          - target: project
            base: /research-gateway/
            site: https://jnist.github.io
    env:
      SITE_URL: ${{ matrix.site }}
      SITE_BASE: ${{ matrix.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Validate published data
        run: npm run validate:data
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test built site
        run: npm run test:e2e

  pages-artifact:
    name: Build Pages artifact
    needs: checks
    if: >-
      github.repository == 'jnist/research-gateway' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      # This repository has its own custom domain, served from the domain root.
      SITE_URL: https://research.jnist.cn
      SITE_BASE: /
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build deployment target
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test deployment target
        run: npm run test:e2e
      - name: Check publication boundary
        shell: bash
        run: |
          test -f dist/index.html
          forbidden="$(find dist \( -type l -o -name temp -o -name node_modules -o -name .git -o -iname 'Release code*' \) -print -quit)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Unexpected private source or symlink in dist: $forbidden"
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist
          retention-days: 1

  deploy:
    name: Deploy Pages
    needs: pages-artifact
    if: >-
      github.repository == 'jnist/research-gateway' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment because main has moved to $head_sha"
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
